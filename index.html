<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Money Calendar</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#13202c;--mute:#5f6c78;--line:#d9dfe5;--g:#d6f0de;--gi:#106030;--y:#fbeebd;--yi:#765700;--r:#f9d6d6;--ri:#9d1c1c;--acc:#1d4f7c;--inc:#17803f;--exp:#b8420d;--sh:#0003;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10171e;--card:#19232d;--ink:#e8eef3;--mute:#9aa8b4;--line:#2c3a47;--g:#14391f;--gi:#7fe0a0;--y:#41350a;--yi:#f1d277;--r:#4a1c1c;--ri:#ffa3a3;--acc:#7db6ea;--inc:#58d286;--exp:#ff9b66}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10171e;--card:#19232d;--ink:#e8eef3;--mute:#9aa8b4;--line:#2c3a47;--g:#14391f;--gi:#7fe0a0;--y:#41350a;--yi:#f1d277;--r:#4a1c1c;--ri:#ffa3a3;--acc:#7db6ea;--inc:#58d286;--exp:#ff9b66}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:76px}
main{max-width:640px;margin:0 auto;padding:14px 12px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:22px 0 8px}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.f>*,.acc>*{min-width:0}
input[type=date]{display:block;min-width:0;max-width:100%;min-height:42px;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
#upd{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--bg);padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:4;font-weight:600}
#upd button{background:var(--bg);color:var(--ink);border:0}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}table.t th:first-child,table.t td:first-child{text-align:left}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
button.del{color:var(--ri)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.warn{background:var(--r);color:var(--ri);border-radius:10px;padding:10px;margin-bottom:10px;font-weight:600}.okb{background:var(--g);color:var(--gi);border-radius:10px;padding:10px;margin-bottom:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.st small{display:block;color:var(--mute);font-size:12px}.st b{font-size:16px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}.stats3 .st{padding:6px 8px}.stats3 .st small{font-size:11px;line-height:1.25}.stats3 .st b{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:12px;color:var(--mute);text-align:center;padding:2px 0}
.day{min-height:62px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:4px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.day.g{background:var(--g);color:var(--gi)}.day.y{background:var(--y);color:var(--yi)}.day.r{background:var(--r);color:var(--ri)}
.day.today{outline:2px solid var(--acc)}.day.blank{visibility:hidden}
.day .n{font-weight:700;font-size:14px}.day .b{font-size:11px;font-weight:600}
.dots{display:flex;gap:3px;min-height:7px}.dots i{width:7px;height:7px;border-radius:50%;display:block}
.i-in{background:var(--inc)}.i-ex{background:var(--exp)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}
.leg span{display:inline-flex;align-items:center;gap:4px}.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;padding:14px 4px;background:none;font-weight:600;color:var(--mute)}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}nav button:disabled{opacity:.45}
#modal{position:fixed;inset:0;background:var(--sh);display:none;align-items:flex-end;justify-content:center;z-index:5}
#modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.row small{color:var(--mute);display:block}
.amt-in{color:var(--inc);font-weight:700}.amt-ex{color:var(--exp);font-weight:700}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.f label{font-size:12px;color:var(--mute)}.f .w{grid-column:1/-1}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.acc label,.set label{font-size:12px;color:var(--mute);display:block}
.set .note{align-self:end;min-height:42px;display:flex;align-items:center;margin:0;font-size:14px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px}
.chip button{border:0;padding:0 2px;background:none;color:var(--mute)}
.msg{color:var(--ri);font-size:14px;min-height:20px}.note{color:var(--mute);font-size:14px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:8px;font:13px monospace}
</style></head><body>
<main id="app"></main>
<nav><button id="t-cal" data-act="tab" data-t="cal">Calendar</button><button id="t-an" data-act="tab" data-t="an">Analytics</button><button id="t-set" data-act="tab" data-t="set">Settings</button></nav>
<div id="modal"></div>
<script>
const K="moneycal1",APPV="0.7",P=n=>String(n).padStart(2,"0"),ds=(y,m,d)=>y+"-"+P(m+1)+"-"+P(d);
const parse=s=>{const a=s.split("-");return[+a[0],+a[1]-1,+a[2]]};
const toD=s=>{const[a,b,c]=parse(s);return new Date(Date.UTC(a,b,c))};
const fromD=d=>ds(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
const addDays=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return fromD(d)};
const dim=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
const addMonths=(s,n,day)=>{let[y,m]=parse(s);m+=n;y+=Math.floor(m/12);m=((m%12)+12)%12;return ds(y,m,Math.min(day,dim(y,m)))};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fm=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const sh=n=>(n<0?"-":"")+(Math.abs(n)>=1000?(Math.abs(n)/1000).toFixed(1)+"k":Math.round(Math.abs(n)));
const nice=s=>toD(s).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"});
const now=new Date(),TODAY=ds(now.getFullYear(),now.getMonth(),now.getDate());
const REP={none:"Does not repeat",weekly:"Weekly",biweekly:"Every 2 weeks",twice:"Twice a month (1st & 15th)",monthly:"Monthly",yearly:"Yearly"};
const ROLES=["Main","Sub","Savings","Credit","Other"];
const DEF={accounts:[],cats:["Rent","Utilities","Food","Subscriptions","Fuel","Loan payments","Fun","Other"],cushion:0,pay:{freq:"biweekly",amount:"",next:""},entries:[]};
function load(){try{const r=localStorage.getItem(K);if(r)return Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(r))}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load(),tab="cal",vy=now.getFullYear(),vm=now.getMonth(),modal=null;
const main=()=>S.accounts.find(a=>a.role==="Main");
const sgn=e=>e.type==="income"?e.amount:-e.amount;
const acctName=id=>(S.accounts.find(a=>a.id===id)||{}).name||"No account";
function occ(e,from,to){const out=[],end=e.end&&e.end<to?e.end:to;if(!e.date)return out;
 if(!e.repeat||e.repeat==="none"){if(e.date>=from&&e.date<=to)out.push(e.date);return out}
 if(e.repeat==="twice"){let[y,m]=parse(e.date);for(let i=0;i<1300;i++){for(const dd of[1,15]){const s=ds(y,m,dd);if(s>=e.date&&s>=from&&s<=end)out.push(s)}m++;if(m>11){m=0;y++}if(ds(y,m,1)>end)break}return out}
 const day=parse(e.date)[2];let s=e.date,i=0;
 while(s<=end&&i<2000&&(!e.count||i<e.count)){if(s>=from)out.push(s);i++;
  s=e.repeat==="weekly"?addDays(e.date,7*i):e.repeat==="biweekly"?addDays(e.date,14*i):e.repeat==="monthly"?addMonths(e.date,i,day):addMonths(e.date,12*i,day)}
 return out}
function all(){const l=S.entries.slice(),m=main();if(m&&+S.pay.amount>0&&S.pay.next)l.push({id:"_pay",virtual:1,type:"income",name:"Paycheck",amount:+S.pay.amount,date:S.pay.next,repeat:S.pay.freq,account:m.id,category:"Pay"});return l}
function expand(e,from,to){if(e.type==="advance"){const o=[];if(e.date>=from&&e.date<=to)o.push([e.date,{...e,type:"income",tag:"advance"}]);if(e.rdate&&e.rdate>=from&&e.rdate<=to)o.push([e.rdate,{...e,type:"expense",amount:e.repay,principal:e.amount,tag:"repayment"}]);return o}
 return occ(e,from,to).map(d=>[d,e])}
function owed(){let t=0;for(const e of S.entries){if(e.type==="advance"){if(e.date<=TODAY&&e.rdate>=TODAY)t+=+e.repay||0}else if(e.type==="bnpl"&&e.count)t+=occ(e,e.date,"2100-01-01").filter(d=>d>=TODAY).length*e.amount}return t}
function ahead(){const m=main();if(!m||!m.asof||m.balance==="")return null;const to=addDays(TODAY,60),map={};let b=+m.balance||0;
 for(const e of all())for(const[d,v]of expand(e,m.asof,to))(map[d]=map[d]||[]).push(v);
 for(let d=m.asof;d<=to;d=addDays(d,1)){for(const v of map[d]||[])if(v.account===m.id)b+=sgn(v);if(d>=TODAY&&b<0)return{d,b}}return null}
function owedAt(d){let t=0;for(const e of S.entries){if(e.type==="advance"){if(e.date<=d&&e.rdate>d)t+=+e.repay||0}else if(e.type==="bnpl"&&e.count)t+=occ(e,e.date,"2100-01-01").filter(x=>x>d).length*e.amount}return t}
function sim(extra){const m=main();if(!m||!m.asof||m.balance==="")return null;const to=addDays(TODAY,90),map={};let b=+m.balance||0;
 for(const e of all().concat(extra||[]))for(const[d,v]of expand(e,m.asof,to))(map[d]=map[d]||[]).push(v);
 const out=[];for(let d=m.asof;d<=to;d=addDays(d,1)){for(const v of map[d]||[])if(v.account===m.id)b+=sgn(v);if(d>=TODAY)out.push([d,b])}return out}
function safe(){const s=sim();if(!s)return null;const p=all().find(e=>e.id==="_pay");let pay=null,end=null;if(p){const o=occ(p,addDays(TODAY,1),addDays(TODAY,90));if(o.length){pay=o[0];end=addDays(o[0],-1)}}
 if(!end)end=s[Math.min(13,s.length-1)][0];if(end<TODAY)end=TODAY;
 return{amt:Math.min(...s.filter(x=>x[0]<=end).map(x=>x[1]))-(+S.cushion||0),pay}}
function safeCard(){const s=safe();if(!s)return"";const n=s.amt;return `<div class="st" style="margin-bottom:10px"><small>Safe to spend until ${s.pay?"payday ("+nice(s.pay)+")":"the next two weeks"}</small><b class="amt-${n<0?"ex":"in"}">${n<0?"Short by "+fm(-n):fm(n)}</b><small>The most you could spend today and still stay ${+S.cushion>0?"above your cushion":"out of the red"}.</small></div>`}
function checker(){return `<div class="chart"><b>Can I afford it?</b><div class="f"><div><label for="c-amt">Purchase amount</label><input id="c-amt" type="number" inputmode="decimal" step="0.01" min="0"></div><div><label for="c-date">On date</label><input id="c-date" type="date" value="${TODAY}" min="${TODAY}"></div></div><div class="hd" style="margin-top:8px"><button data-act="chk">Check it</button></div><div id="c-out"></div></div>`}
function warn(){const f=ahead();return f?`<div class="warn">Heads up: your Main account is projected to be ${fm(-f.b)} short on ${nice(f.d)}. Cover that gap before then so you don’t need an advance.</div>`:`<div class="okb">No shortfall projected in the next 60 days.</div>`}
function calData(){const first=ds(vy,vm,1),last=ds(vy,vm,dim(vy,vm)),m=main(),asof=m&&m.asof&&m.balance!==""?m.asof:null,from=asof&&asof<first?asof:first,map={},eod={};
 for(const e of all())for(const[d,v]of expand(e,from,last))(map[d]=map[d]||[]).push(v);
 if(asof&&asof<=last){let b=+m.balance||0;for(let d=asof;d<=last;d=addDays(d,1)){for(const e of map[d]||[])if(e.account===m.id)b+=sgn(e);eod[d]=b}}
 return{first,last,map,eod,asof}}
const cls=b=>b<0?"r":b<(+S.cushion||0)?"y":"g";
function renderCal(){const D=calData(),dow=toD(D.first).getUTCDay(),n=dim(vy,vm);
 const title=new Date(Date.UTC(vy,vm,1)).toLocaleDateString("en-US",{month:"long",year:"numeric",timeZone:"UTC"});
 let low=null,lowD=null;for(let d=1;d<=n;d++){const k=ds(vy,vm,d);if(D.eod[k]!==undefined&&(low===null||D.eod[k]<low)){low=D.eod[k];lowD=k}}
 let h=`<div class="hd"><button data-act="prev" aria-label="Previous month">‹</button><h1>${title}</h1><button data-act="next" aria-label="Next month">›</button></div>`;
 if(!D.asof)h+=`<div class="empty"><b>Set up your Main account first.</b><p class="note">Add the account you’re paid into and spend from, with its balance and the date it’s accurate as of. The calendar colors use that account only.</p><button class="pri" data-act="tab" data-t="set">Open Settings</button></div>`;
 else{const end=D.eod[D.last],td=D.eod[TODAY],sf=safe(),ow=owed(),f=ahead();
   if(f)h+=`<div class="warn">Short by ${fm(-f.b)} on ${nice(f.d)}. Cover it before then so you don’t need an advance.</div>`;
   h+=`<div class="stats3"><div class="st"><small>Today</small><b class="${td<0?"amt-ex":""}">${td===undefined?"–":fm(td)}</b>${td!==undefined&&ow>0?"<small>After apps: "+fm(td-ow)+"</small>":""}</div><div class="st"><small>Safe to spend</small><b class="${sf&&sf.amt<0?"amt-ex":"amt-in"}">${sf?fm(sf.amt):"–"}</b><small>${sf&&sf.pay?"until "+nice(sf.pay):"next 2 weeks"}</small></div><div class="st"><small>End of month</small><b class="amt-${end<0?"ex":"in"}">${end===undefined?"–":fm(end)}</b>${end!==undefined&&owedAt(D.last)?"<small>After apps: "+fm(end-owedAt(D.last))+"</small>":""}</div></div>`;
   var det=`<h2>Month details</h2><div class="row"><div>Lowest point<small>${lowD?nice(lowD):""}</small></div><b>${low===null?"–":fm(low)}</b></div><div class="row"><div>Owed to apps<small>Unpaid advances and pay-later payments</small></div><b class="${ow>0?"amt-ex":""}">${fm(ow)}</b></div><p class="note">Safe to spend is the most you could spend today and still stay ${+S.cushion>0?"above your cushion":"out of the red"} until your next payday.</p>`+checker()}
 h+=`<div class="grid">`+["S","M","T","W","T","F","S"].map(x=>`<div class="dow">${x}</div>`).join("");
 for(let i=0;i<dow;i++)h+=`<div class="day blank"></div>`;
 for(let d=1;d<=n;d++){const k=ds(vy,vm,d),es=D.map[k]||[],b=D.eod[k],m=main();
  const hasIn=es.some(e=>e.type==="income"),hasEx=es.some(e=>e.type!=="income");
  h+=`<button class="day ${b===undefined?"":cls(b)} ${k===TODAY?"today":""}" data-act="day" data-d="${k}" aria-label="${nice(k)}${b===undefined?"":", projected "+fm(b)}"><span class="n">${d}</span><span class="dots">${hasIn?'<i class="i-in"></i>':""}${hasEx?'<i class="i-ex"></i>':""}</span><span class="b">${b===undefined?"&nbsp;":sh(b)}</span></button>`}
 h+=`</div><div class="leg"><span><i class="sw" style="background:var(--g)"></i>At or above cushion</span><span><i class="sw" style="background:var(--y)"></i>Below cushion</span><span><i class="sw" style="background:var(--r)"></i>Negative</span><span><i class="sw i-in"></i>Income</span><span><i class="sw i-ex"></i>Bill or expense</span></div><p class="note">Day numbers show the projected Main account balance at the end of each day.</p>`;h+=det||"";
 return h}
function opts(list,sel){return list.map(x=>`<option value="${esc(x[0])}" ${x[0]===sel?"selected":""}>${esc(x[1])}</option>`).join("")}
function renderDay(){const k=modal.date,D=calData(),es=D.map[k]||[],m=main(),b=D.eod[k];
 const ed=modal.edit?S.entries.find(e=>e.id===modal.edit):null,v=ed||{type:"expense",name:"",amount:"",category:S.cats[0]||"",account:m?m.id:(S.accounts[0]||{}).id||"",date:k,repeat:"none",end:"",count:"",repay:"",rdate:""};
 let h=`<div class="hd"><h1>${nice(k)}</h1><button data-act="close">Close</button></div>`;
 if(b!==undefined)h+=`<p class="note">Main account at end of day: <b class="amt-${b<0?"ex":"in"}">${fm(b)}</b>${owedAt(k)>0?`<br>After repaying apps: <b class="amt-${b-owedAt(k)<0?"ex":"in"}">${fm(b-owedAt(k))}</b>`:""}</p>`;
 h+=es.length?es.map(e=>`<div class="row"><div><b>${esc(e.name)}</b><small>${esc(e.category)} · ${esc(acctName(e.account))}${e.provider&&e.provider!=="Other"?" · "+e.provider:""}${e.tag?" · "+e.tag:""}${e.type==="bnpl"?" · pay-later":""}${e.repeat&&e.repeat!=="none"?" · "+REP[e.repeat]:""}${m&&e.account!==m.id?" · not in Main":""}${e.virtual?" · from Settings":""}</small></div><div style="text-align:right"><span class="amt-${e.type==="income"?"in":"ex"}">${e.type==="income"?"+":"-"}${fm(e.amount)}</span>${e.virtual?"":`<br><button data-act="edit" data-id="${e.id}">Edit</button>`}</div></div>`).join(""):`<p class="note">Nothing on this day yet.</p>`;
 h+=`<h2>${ed?"Edit entry":"Add to this day"}</h2><div class="f">
 <div><label for="f-type">Type</label><select id="f-type">${typeOpts(v.type==="bnpl"||v.type==="advance"?v.type+":"+(v.provider||"Other"):v.type)}</select></div>
 <div><label for="f-amt" id="l-amt">Amount</label><input id="f-amt" type="number" inputmode="decimal" step="0.01" min="0" value="${v.amount}"></div>
 <div class="w"><label for="f-name">Name</label><input id="f-name" value="${esc(v.name)}" placeholder="Electric bill, groceries, paycheck…"></div>
 <div><label for="f-cat">Category</label><select id="f-cat">${opts(S.cats.map(c=>[c,c]),v.category)}</select></div>
 <div><label for="f-acct">Account or card</label><select id="f-acct">${opts(S.accounts.map(a=>[a.id,a.name]),v.account)}</select></div>
 <div><label for="f-date" id="l-date">Date</label><input id="f-date" type="date" value="${v.date}"></div>
 <div id="g-rep"><label for="f-rep">Repeat</label><select id="f-rep">${opts(Object.entries(REP),v.repeat)}</select></div>
 <div class="w" id="g-end"><label for="f-end">Repeat until (optional)</label><input id="f-end" type="date" value="${v.end||""}"></div>
 <div class="w" id="g-bnpl"><label for="f-count">Number of payments (blank if ongoing)</label><input id="f-count" type="number" inputmode="numeric" min="1" value="${v.count||""}"></div>
 <div id="g-adv1"><label for="f-repay">Amount to repay (with fee or tip)</label><input id="f-repay" type="number" inputmode="decimal" step="0.01" value="${v.repay||""}"></div>
 <div id="g-adv2"><label for="f-rdate">Repayment date</label><input id="f-rdate" type="date" value="${v.rdate||""}"></div></div>
 <p class="msg" id="f-msg"></p><div class="hd"><button class="pri" data-act="saveEntry">${ed?"Save changes":"Add entry"}</button>${ed?`<button class="del" data-act="delEntry">Delete</button>`:""}</div>${ed&&ed.repeat!=="none"?`<p class="note">Changes and deletes apply to every repeat of this entry.</p>`:""}`;
 return h}
function openModal(){const m=document.getElementById("modal");m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${renderDay()}</div>`;m.classList.add("open");applyType()}
function typeOpts(sel){const o=(v,l)=>`<option value="${v}" ${v===sel?"selected":""}>${l}</option>`;
 return o("income","Income")+o("bill","Bill")+o("expense","Expense")+`<optgroup label="Pay-later payment">`+["Klarna","Affirm","Other"].map(p=>o("bnpl:"+p,p==="Other"?"Other pay-later":p)).join("")+`</optgroup><optgroup label="Cash advance">`+["Dave","Tilt","EarnIn","MoneyLion","Other"].map(p=>o("advance:"+p,p==="Other"?"Other cash advance":p)).join("")+`</optgroup>`}
function applyType(){const t=document.getElementById("f-type");if(!t)return;const y=t.value.split(":")[0],s=(i,on)=>{document.getElementById(i).style.display=on?"":"none"};s("g-bnpl",y==="bnpl");s("g-adv1",y==="advance");s("g-adv2",y==="advance");s("g-rep",y!=="advance");s("g-end",y!=="advance");document.getElementById("l-date").textContent=y==="advance"?"Date it arrives":"Date";document.getElementById("l-amt").textContent=y==="advance"?"Amount you receive":y==="bnpl"?"Each payment":"Amount"}
function closeModal(){modal=null;document.getElementById("modal").classList.remove("open")}
function renderSet(){let h=`<h1>Settings</h1><h2>Accounts</h2><p class="note">Mark one account as Main. Only the Main account drives the calendar colors; credit cards count as debt.</p>`;
 h+=S.accounts.map((a,i)=>`<div class="acc"><div><label>Name</label><input data-a="${i}" data-f="name" value="${esc(a.name)}"></div><div><label>Role</label><select data-a="${i}" data-f="role">${opts(ROLES.map(r=>[r,r]),a.role)}</select></div><div><label>Balance</label><input data-a="${i}" data-f="balance" type="number" inputmode="decimal" step="0.01" value="${a.balance}"></div><div><label>Accurate as of</label><input data-a="${i}" data-f="asof" type="date" value="${a.asof||""}"></div><div><button class="del" data-act="delAcct" data-i="${i}">Remove account</button></div></div>`).join("");
 h+=`<button data-act="addAcct">Add account</button><h2>Paycheck</h2><div class="acc set"><div><label>How often</label><select data-k="pay.freq">${opts(Object.entries(REP).filter(x=>x[0]!=="none"),S.pay.freq)}</select></div><div><label>Amount</label><input data-k="pay.amount" type="number" inputmode="decimal" step="0.01" value="${S.pay.amount}"></div><div><label>Next payday</label><input data-k="pay.next" type="date" value="${S.pay.next}"></div><div class="note">Goes into the Main account on each payday.</div></div>
 <h2>Safety cushion</h2><div class="acc set"><div><label>Turn days yellow below</label><input data-k="cushion" type="number" inputmode="decimal" step="1" value="${S.cushion}"></div><div class="note">Zero means a day only turns red when it goes negative.</div></div>
 <h2>Categories</h2><div class="chips">${S.cats.map((c,i)=>`<span class="chip">${esc(c)}<button data-act="delCat" data-i="${i}" aria-label="Remove ${esc(c)}">×</button></span>`).join("")}</div><div class="f"><input id="newcat" placeholder="New category"><button data-act="addCat">Add category</button></div>
 <h2>Backup</h2><p class="note">Data lives in this browser only. Copy it somewhere safe, or paste a backup to restore.</p><textarea id="bk" aria-label="Backup data"></textarea><div class="hd"><button data-act="exp">Show backup</button><button data-act="imp">Restore from text</button></div><p class="msg" id="bkm"></p><p class="note">App version ${APPV}</p>`;
 return h}
function stats(y,m){const f=ds(y,m,1),l=ds(y,m,dim(y,m)),s={inc:0,spend:0,cat:{},adv:0,advN:0,fees:0,bnpl:0};
 for(const e of all())for(const[d,v]of expand(e,f,l)){
  if(v.tag==="advance"){s.adv+=v.amount;s.advN++}
  else if(v.tag==="repayment"){const fee=(v.amount||0)-(v.principal||0);if(fee>0){s.fees+=fee;s.spend+=fee;s.cat["Borrowing fees"]=(s.cat["Borrowing fees"]||0)+fee}}
  else if(v.type==="income")s.inc+=v.amount;
  else{s.spend+=v.amount;const c=v.category||"Other";s.cat[c]=(s.cat[c]||0)+v.amount;if(v.type==="bnpl")s.bnpl+=v.amount}}
 return s}
function pareto(cat){const a=Object.entries(cat).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]);if(!a.length)return'<p class="note" style="margin:6px">No spending on the calendar this month yet.</p>';
 const tot=a.reduce((t,x)=>t+x[1],0),W=340,H=210,L=44,R=10,T=10,B=64,ph=H-B-T,bw=(W-L-R)/a.length;let cum=0,bars="",pts=[],lab="";
 a.forEach(([k,v],i)=>{const x=L+i*bw,bh=v/tot*ph;cum+=v;pts.push([(x+bw/2).toFixed(1),(T+ph-cum/tot*ph).toFixed(1)]);
  bars+=`<rect x="${(x+3).toFixed(1)}" y="${(T+ph-bh).toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="var(--acc)"><title>${esc(k)}: ${fm(v)}</title></rect>`;
  lab+=`<text transform="translate(${(x+bw/2).toFixed(1)},${T+ph+12}) rotate(-40)" text-anchor="end" font-size="11" fill="currentColor">${esc(k)}</text>`});
 const y80=T+ph-0.8*ph;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Pareto chart of spending by category" style="color:var(--ink)"><line x1="${L}" y1="${T+ph}" x2="${W-R}" y2="${T+ph}" stroke="var(--line)"/><line x1="${L}" y1="${y80}" x2="${W-R}" y2="${y80}" stroke="var(--mute)" stroke-dasharray="4 3"/><text x="${L-4}" y="${y80+4}" text-anchor="end" font-size="10" fill="var(--mute)">80%</text><text x="${L-4}" y="${T+8}" text-anchor="end" font-size="10" fill="var(--mute)">${fm(tot).replace(".00","")}</text><text x="${L-4}" y="${T+ph}" text-anchor="end" font-size="10" fill="var(--mute)">$0</text>${bars}<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--exp)" stroke-width="2"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--exp)"/>`).join("")}${lab}</svg>`}
function renderAn(){const s=stats(vy,vm),mn=(y,m,o)=>new Date(Date.UTC(y,m,1)).toLocaleDateString("en-US",Object.assign({timeZone:"UTC"},o));
 let h=`<div class="hd"><button data-act="prev" aria-label="Previous month">‹</button><h1>${mn(vy,vm,{month:"long",year:"numeric"})}</h1><button data-act="next" aria-label="Next month">›</button></div>`;
 h+=`<div class="stats"><div class="st"><small>Money in</small><b class="amt-in">${fm(s.inc)}</b></div><div class="st"><small>Money out</small><b class="amt-ex">${fm(s.spend)}</b></div><div class="st"><small>Net</small><b class="amt-${s.inc-s.spend<0?"ex":"in"}">${fm(s.inc-s.spend)}</b></div><div class="st"><small>Fees and tips paid</small><b>${fm(s.fees)}</b></div></div>`;
 h+=`<h2>Where the money goes</h2><div class="chart">${pareto(s.cat)}</div><p class="note">Each bar is a category’s share of the month’s spending. The line adds them up, so you can see which few categories make up most of it.</p>`;
 h+=`<h2>Borrowing</h2><div class="row"><div>Advances taken<small>${s.advN} this month</small></div><b>${fm(s.adv)}</b></div><div class="row"><div>Fees and tips paid</div><b>${fm(s.fees)}</b></div><div class="row"><div>Pay-later payments due</div><b>${fm(s.bnpl)}</b></div><div class="row"><div>Owed to apps today</div><b>${fm(owed())}</b></div>`;
 h+=`<h2>Last 6 months</h2><div style="overflow-x:auto"><table class="t"><tr><th>Month</th><th>In</th><th>Out</th><th>Advances</th><th>Fees</th></tr>`;
 for(let i=5;i>=0;i--){let y=vy,m=vm-i;while(m<0){m+=12;y--}const q=stats(y,m);h+=`<tr><td>${mn(y,m,{month:"short",year:"2-digit"})}</td><td>${"$"+sh(q.inc)}</td><td>${"$"+sh(q.spend)}</td><td>${q.advN} (${"$"+sh(q.adv)})</td><td>${fm(q.fees)}</td></tr>`}
 return h+`</table></div><p class="note">Based on everything on your calendar, planned or already past. Advance repayments count only for the fee or tip, not the borrowed amount.</p>`}
function render(){document.getElementById("app").innerHTML=tab==="cal"?renderCal():tab==="an"?renderAn():renderSet();document.getElementById("t-cal").className=tab==="cal"?"on":"";document.getElementById("t-an").className=tab==="an"?"on":"";document.getElementById("t-set").className=tab==="set"?"on":""}
const id=x=>document.getElementById(x).value;
const act={
 tab(t){tab=t.dataset.t;render();scrollTo(0,0)},
 prev(){vm--;if(vm<0){vm=11;vy--}render()},next(){vm++;if(vm>11){vm=0;vy++}render()},
 day(t){modal={date:t.dataset.d};openModal()},close:closeModal,
 edit(t){modal.edit=t.dataset.id;openModal()},
 saveEntry(){const amt=parseFloat(id("f-amt")),msg=document.getElementById("f-msg");
  if(!(amt>0)){msg.textContent="Enter an amount above 0.";return}
  if(!id("f-date")){msg.textContent="Pick a date.";return}
  const tv=id("f-type").split(":"),ty=tv[0],pv=tv[1]||"";if(ty==="advance"&&!id("f-rdate")){msg.textContent="Pick the repayment date.";return}
  const e={id:modal.edit||"e"+Date.now(),type:ty,provider:pv,name:id("f-name").trim()||(pv&&pv!=="Other"?pv:"")||id("f-cat")||"Untitled",amount:amt,category:id("f-cat"),account:id("f-acct"),date:id("f-date"),repeat:ty==="advance"?"none":id("f-rep"),end:ty==="advance"?"":id("f-end"),count:ty==="bnpl"?(parseInt(id("f-count"))||""):"",repay:ty==="advance"?(parseFloat(id("f-repay"))||amt):0,rdate:ty==="advance"?id("f-rdate"):""};
  const i=S.entries.findIndex(x=>x.id===e.id);if(i>=0)S.entries[i]=e;else S.entries.push(e);save();closeModal();render()},
 delEntry(){S.entries=S.entries.filter(x=>x.id!==modal.edit);save();closeModal();render()},
 addAcct(){S.accounts.push({id:"a"+Date.now(),name:"New account",role:S.accounts.length?"Sub":"Main",balance:"",asof:TODAY});save();render()},
 delAcct(t){S.accounts.splice(+t.dataset.i,1);save();render()},
 addCat(){const v=id("newcat").trim();if(v&&!S.cats.includes(v)){S.cats.push(v);save();render()}},
 delCat(t){S.cats.splice(+t.dataset.i,1);save();render()},
 chk(){const a=parseFloat(id("c-amt")),d=id("c-date"),o=document.getElementById("c-out"),m=main();
  if(!(a>0)||!d){o.innerHTML='<p class="msg">Enter an amount and a date.</p>';return}
  const base=sim(),alt=sim([{id:"_x",type:"expense",amount:a,date:d<TODAY?TODAY:d,repeat:"none",account:m.id}]),low=Math.min(...alt.map(x=>x[1])),bl=Math.min(...base.map(x=>x[1])),neg=alt.find(x=>x[1]<0),nb=base.find(x=>x[1]<0);
  o.innerHTML=neg?(nb?`<p class="msg">You’re already projected to go short, and this ${fm(a)} would make the gap bigger. Lowest point: ${fm(low)}.</p>`:`<p class="msg">This would put your Main account ${fm(-neg[1])} short on ${nice(neg[0])}. Waiting or skipping it avoids needing to borrow.</p>`):`<p class="note"><b class="amt-in">Affordable.</b> Your lowest balance over the next 90 days would be ${fm(low)} (${fm(bl)} without it).${low<(+S.cushion||0)?" That’s below your safety cushion.":""}</p>`},
 exp(){document.getElementById("bk").value=JSON.stringify(S)},
 imp(){try{const o=JSON.parse(id("bk"));S=Object.assign(JSON.parse(JSON.stringify(DEF)),o);save();render()}catch(e){document.getElementById("bkm").textContent="That text isn’t a valid backup."}}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(t&&act[t.dataset.act])act[t.dataset.act](t);else if(e.target.id==="modal")closeModal()});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="f-type")applyType();
 if(t.dataset.a!==undefined){const a=S.accounts[+t.dataset.a];a[t.dataset.f]=t.value;if(t.dataset.f==="role"&&t.value==="Main")S.accounts.forEach(x=>{if(x!==a&&x.role==="Main")x.role="Sub"});save();render()}
 else if(t.dataset.k){const p=t.dataset.k.split(".");if(p.length===2)S[p[0]][p[1]]=t.value;else S[p[0]]=t.value;save()}});
async function checkUpdate(){try{const r=await fetch(location.pathname+"?c="+Date.now(),{cache:"no-store"});if(!r.ok)return;const m=(await r.text()).match(/APPV="(\d[^"]*)"/);if(m&&m[1]!==APPV)showUpd()}catch(e){}}
function showUpd(){if(document.getElementById("upd"))return;const d=document.createElement("div");d.id="upd";d.innerHTML='A new version is ready. <button id="updb">Update now</button>';document.body.appendChild(d);document.getElementById("updb").onclick=async()=>{try{await fetch(location.pathname,{cache:"reload"})}catch(e){}location.reload()}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate()});
checkUpdate();render();
</script></body></html>
